name: Build MobileGlues for Android ARM64

on:
  push:
  workflow_dispatch:

jobs:
  build-arm64-v8a:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build MobileGlues
        working-directory: MobileGlues-cpp
        run: |
          NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}"

          if [ -z "$NDK_HOME" ]; then
            NDK_HOME="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi

          echo "Using Android NDK: $NDK_HOME"

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26

          cmake --build build \
            --target mobileglues \
            --parallel

      - name: Create maximum-compression ZIP
        run: |
          mkdir -p package/arm64-v8a
          cp MobileGlues-cpp/build/libmobileglues.so package/arm64-v8a/

          cd package
          zip -9 -X ../MobileGlues-arm64-v8a.zip arm64-v8a/libmobileglues.so

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MobileGlues-arm64-v8a
          path: MobileGlues-arm64-v8a.zip
          compression-level: 0

