name: Build MobileGlues for Android ARM64

on: [push, workflow_dispatch]

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Build MobileGlues
        run: |
          cd MobileGlues-cpp

          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT}}"

          if [ -z "$NDK" ]; then
            NDK="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi

          echo "Using NDK: $NDK"

          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DSTATICLIB=OFF \
            -DCMAKE_C_FLAGS=-Wno-error=implicit-function-declaration

          cmake --build build --config Release --target mobileglues

      - name: Compress lib
        run: |
          mkdir -p package/arm64-v8a
          cp MobileGlues-cpp/build/libmobileglues.so package/arm64-v8a/

          cd package
          zip -9 -X ../MobileGlues-arm64-v8a.zip arm64-v8a/libmobileglues.so

      - name: Upload lib
        uses: actions/upload-artifact@v4
        with:
          name: MobileGlues-Android-arm64-v8a
          path: MobileGlues-arm64-v8a.zip
